<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ricardo Santibañez · Tinkuy NFC</title>
<meta name="description" content="Escríbeme por WhatsApp o guarda mi contacto.">
<meta name="theme-color" content="#0d0f14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d0f14;--card:#151922;--line:#262c39;--text:#f2f4f8;--muted:#9aa3b5;--accent:#3cf0b4;--wa:#25d366}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
    font-family:"Space Grotesk",system-ui,sans-serif;color:var(--text);
    background:radial-gradient(120% 70% at 50% -10%,#1b2a33 0%,var(--bg) 60%)}
  .card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:36px 24px 28px;text-align:center;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;inset:-40% -40% auto auto;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle,rgba(60,240,180,.18),transparent 70%)}
  .waves{width:56px;height:56px;margin:0 auto 18px;display:block}
  .waves path{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}
  h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
  .role{color:var(--accent);font-weight:600;font-size:15px;margin-top:6px}
  .loc{color:var(--muted);font-size:14px;margin-top:4px}
  .btns{display:grid;gap:12px;margin-top:28px}
  a.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:14px;
    font-weight:700;font-size:17px;text-decoration:none;transition:transform .1s}
  a.btn:active{transform:scale(.98)}
  .wa{background:var(--wa);color:#06260f}
  .save{background:transparent;color:var(--text);border:1.5px solid var(--line)}
  .btn svg{width:22px;height:22px;flex:none}
  .foot{margin-top:26px;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
<main class="card">
  <svg class="waves" viewBox="0 0 56 56" aria-hidden="true"><path d="M20 18a14 14 0 0 1 0 20"/><path d="M28 12a22 22 0 0 1 0 32"/><path d="M36 6a30 30 0 0 1 0 44"/><circle cx="12" cy="28" r="4" fill="#3cf0b4"/></svg>
  <h1>Ricardo Santibañez</h1>
  <p class="role" id="role">Tinkuy NFC · Encuentros digitales</p>
  <p class="loc">Lima · Tarma</p>
  <div class="btns">
    <a class="btn wa" href="https://wa.me/51933654709?text=Hola%20Ricardo%2C%20te%20contacto%20por%20tu%20tarjeta%20NFC">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.2 1.1z"/></svg>
      Escríbeme por WhatsApp</a>
    <a class="btn save" href="ricardo-santibanez.vcf" download>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="8" r="4"/><path d="M2 21c0-4 3.6-7 8-7"/><path d="M19 14v7M15.5 17.5h7"/></svg>
      Guardar contacto</a>
  </div>
  <p class="foot">Toca · Conecta</p>
</main>
</body>
</html>
