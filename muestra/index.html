<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Café Wayra · Muestra Tinkuy NFC</title>
<meta name="description" content="Página de muestra de una placa NFC de Tinkuy: reseñas, WhatsApp y redes sociales de un negocio de ejemplo.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2b1d16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f6efe4;   /* fondo */
    --paper:#fffaf2;
    --coffee:#2b1d16;  /* texto y botón WhatsApp */
    --soft:#5b4a3f;
    --line:#d9cbb8;
    --terra:#a8471f;   /* botón principal */
    --gold:#e0a43a;    /* estrellas */
  }
  *{box-sizing:border-box;margin:0}
  html,body{background:var(--cream)}
  body{min-height:100vh;display:flex;justify-content:center;font-family:"Manrope",system-ui,sans-serif;color:var(--coffee);-webkit-font-smoothing:antialiased}
  main{width:100%;max-width:440px;min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  a:focus-visible{outline:3px solid var(--terra);outline-offset:3px}
  header{background:var(--coffee);color:var(--paper);padding:44px 24px 30px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
  .mark{width:72px;height:72px}
  h1{font-family:"Fraunces",Georgia,serif;font-size:34px;font-weight:700;line-height:1;letter-spacing:-.01em}
  .tag{font-size:14px;font-weight:500;color:#e8dccb}
  .content{flex:1;padding:24px 24px 20px;display:flex;flex-direction:column;gap:14px}
  .ask{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0 6px}
  .ask svg{width:150px;height:26px}
  .ask p{font-size:15px;font-weight:700}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;border-radius:16px;font-size:17px;font-weight:800;transition:transform .1s}
  .btn:active{transform:scale(.98)}
  .btn svg{width:22px;height:22px;flex:none}
  .review{background:var(--terra);color:#fff}
  .wa{background:var(--coffee);color:var(--paper)}
  .label{margin-top:8px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);text-align:center}
  .social{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .soc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:76px;border-radius:14px;border:2px solid var(--line);background:var(--paper);font-size:14px;font-weight:700}
  .soc svg{width:24px;height:24px;fill:none;stroke:var(--coffee);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .demo{margin:6px 24px 0;padding:14px 16px;border-radius:14px;border:2px dashed var(--line);font-size:13px;line-height:1.45;color:var(--soft);text-align:center}
  .demo a{font-weight:800;color:var(--terra);text-decoration:underline}
  .foot{padding:14px 24px 24px;text-align:center;font-size:12px;color:var(--soft)}
  .foot strong{color:var(--coffee)}
</style>
</head>
<body>
<main>
  <header>
    <svg class="mark" viewBox="0 0 72 72" aria-hidden="true">
      <circle cx="36" cy="36" r="34" fill="none" stroke="#e0a43a" stroke-width="2.5"/>
      <path d="M20 32h26v9a13 13 0 0 1-26 0z" fill="#fffaf2"/>
      <path d="M46 35h3a5 5 0 0 1 0 10h-4" fill="none" stroke="#fffaf2" stroke-width="3"/>
      <path d="M27 18c-2 3 2 5 0 8M34 16c-2 3 2 5 0 8M41 18c-2 3 2 5 0 8" fill="none" stroke="#e0a43a" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <h1>Café Wayra</h1>
    <p class="tag">Café de altura · Tarma</p>
  </header>

  <section class="content">
    <div class="ask">
      <svg viewBox="0 0 150 26" role="img" aria-label="Cinco estrellas"><g fill="#e0a43a"><path id="s" d="M13 1l3.5 7.2 7.9 1.1-5.7 5.6 1.3 7.8L13 19l-7 3.7 1.3-7.8L1.6 9.3l7.9-1.1z"/><use href="#s" x="31"/><use href="#s" x="62"/><use href="#s" x="93"/><use href="#s" x="124"/></g></svg>
      <p>¿Te gustó tu visita? Cuéntanos.</p>
    </div>
    <a class="btn review" href="https://www.google.com/maps/search/?api=1&amp;query=caf%C3%A9%20Tarma">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>
      Déjanos tu reseña en Google</a>
    <a class="btn wa" href="https://wa.me/51933654709?text=Hola%2C%20vengo%20de%20la%20placa%20NFC%20de%20muestra">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.2 1.1z"/></svg>
      Escríbenos por WhatsApp</a>

    <p class="label">Síguenos</p>
    <nav class="social" aria-label="Redes sociales">
      <a class="soc" href="https://www.instagram.com/"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r=".6"/></svg>Instagram</a>
      <a class="soc" href="https://www.tiktok.com/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>TikTok</a>
      <a class="soc" href="https://www.facebook.com/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11v9M7 11l4-7a2 2 0 0 1 3 2l-1 4h5a2 2 0 0 1 2 2.3l-1 6A2 2 0 0 1 17 20H7M3 11h4v9H3z"/></svg>Facebook</a>
    </nav>
  </section>

  <p class="demo">Esta es una <strong>página de muestra</strong>: Café Wayra es un negocio de ejemplo. ¿Quieres una placa así para tu negocio? <a href="https://wa.me/51933654709?text=Hola%20Ricardo%2C%20vi%20la%20muestra%20de%20Tinkuy%20NFC%20y%20quiero%20una%20placa">Escríbenos</a></p>
  <p class="foot">Placa NFC por <strong>Tinkuy</strong></p>
</main>
</body>
</html>
