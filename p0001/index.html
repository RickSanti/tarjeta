<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Armando Santibañez · Ingeniero Agrícola</title>

<meta name="theme-color" content="#0b3c5d">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#072a40;
    --blue:#0b3c5d;     /* fondo */
    --ring:#0e4a72;
    --line:#2e6f96;
    --text:#eef6fa;
    --soft:#c4dbe8;
    --muted:#9fbccd;
    --aqua:#5cc8e8;     /* acento */
  }
  *{box-sizing:border-box;margin:0}
  html,body{background:var(--blue)}
  body{min-height:100vh;display:flex;justify-content:center;font-family:"Manrope",system-ui,sans-serif;
    color:var(--text);-webkit-font-smoothing:antialiased}
  main{width:100%;max-width:440px;min-height:100vh;padding:56px 24px 28px;display:flex;flex-direction:column;
    align-items:center;justify-content:space-between;gap:32px}
  a{color:inherit;text-decoration:none}
  a:focus-visible{outline:3px solid var(--aqua);outline-offset:3px}
  .top{width:100%;display:flex;flex-direction:column;align-items:center;gap:28px}
  .emblem{width:132px;height:132px}
  .who{text-align:center}
  h1{font-size:clamp(25px,7.4vw,28px);font-weight:800;line-height:1.15;letter-spacing:-.01em}
  .role{margin-top:14px;font-size:16px;font-weight:700;color:var(--aqua)}
  .spec{margin-top:6px;font-size:15px;color:var(--soft)}
  .actions{width:100%;display:flex;flex-direction:column;gap:12px;padding-top:12px}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;border-radius:16px;
    font-size:17px;font-weight:800;transition:transform .1s}
  .btn:active{transform:scale(.98)}
  .btn svg{width:22px;height:22px;flex:none}
  .wa{background:var(--aqua);color:var(--deep)}
  .save{border:2px solid var(--line)}
  .tel{padding:8px 12px;font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--soft)}
  .foot{font-size:12px;color:var(--muted)}
  .foot strong{color:var(--text)}
</style>
</head>
<body>
<main>
  <div class="top">
    <svg class="emblem" viewBox="0 0 132 132" aria-hidden="true">
      <circle cx="66" cy="66" r="62" fill="none" stroke="#5cc8e8" stroke-opacity=".25" stroke-width="2"/>
      <circle cx="66" cy="66" r="48" fill="none" stroke="#5cc8e8" stroke-opacity=".5" stroke-width="2.5"/>
      <circle cx="66" cy="66" r="34" fill="#0e4a72" stroke="#5cc8e8" stroke-width="3"/>

    </div>
    <div class="actions">

        Escríbeme por WhatsApp</a>
      <a class="btn save" href="armando-santibanez.vcf" download>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="8" r="4"/><path d="M2 21c0-4 3.6-7 8-7"/><path d="M19 14v7M15.5 17.5h7"/></svg>
        Guardar contacto</a>
    </div>
    <a class="tel" href="tel:+51999853559">+51 999 853 559</a>
  </div>
  <p class="foot">Tarjeta NFC por <strong>Tinkuy</strong></p>
</main>
</body>
</html>
