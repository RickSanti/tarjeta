<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Armando Santibañez · Ingeniero Agrícola</title>
<meta name="description" content="Ingeniero Agrícola, especialista en Recursos Hídricos. Escríbeme por WhatsApp o guarda mi contacto.">
<meta name="theme-color" content="#0b3c5d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#072a40;     /* fondo */
    --blue:#0b3c5d;     /* encabezado y recuadros */
    --line:#2e6f96;
    --text:#eef6fa;
    --soft:#c4dbe8;
    --muted:#9fbccd;
    --aqua:#5cc8e8;     /* acento */
  }
  *{box-sizing:border-box;margin:0}
  html{background:var(--deep)}
  body{min-height:100vh;display:flex;justify-content:center;font-family:"Manrope",system-ui,sans-serif;
    color:var(--text);background:var(--deep);-webkit-font-smoothing:antialiased}
  main{width:100%;max-width:440px;min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  a:focus-visible{outline:3px solid var(--aqua);outline-offset:3px}

  header{position:relative;overflow:hidden;background:var(--blue);padding:52px 24px 28px;min-height:340px;
    display:flex;flex-direction:column;justify-content:space-between;gap:40px}
  header .waves{position:absolute;right:-10px;bottom:-12px;width:300px;height:300px;pointer-events:none}
  header .drop{width:40px;height:44px;position:relative}
  h1{font-size:clamp(26px,8vw,32px);font-weight:800;line-height:1.1;letter-spacing:-.015em;position:relative}
  .role{margin-top:10px;font-size:16px;font-weight:700;color:var(--aqua);position:relative}

  .content{flex:1;padding:24px 24px 28px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
  .info{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:var(--blue)}
  .row svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--aqua);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .row small{display:block;font-size:12px;color:var(--muted)}
  .row b{display:block;margin-top:2px;font-size:15px}

  .actions{display:flex;flex-direction:column;gap:12px}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;border-radius:16px;
    font-size:17px;font-weight:800;transition:transform .1s}
  .btn:active{transform:scale(.98)}
  .btn svg{width:22px;height:22px;flex:none}
  .wa{background:var(--aqua);color:var(--deep)}
  .save{border:2px solid var(--line)}
  .foot{margin-top:6px;text-align:center;font-size:12px;color:var(--muted)}
  .foot strong{color:var(--text)}
</style>
</head>
<body>
<main>
  <header>
    <svg class="waves" viewBox="0 0 300 300" aria-hidden="true">
      <g fill="none" stroke="#5cc8e8">
        <circle cx="290" cy="312" r="70" stroke-opacity=".55" stroke-width="2"/>
        <circle cx="290" cy="312" r="120" stroke-opacity=".35" stroke-width="2"/>
        <circle cx="290" cy="312" r="172" stroke-opacity=".2" stroke-width="1.5"/>
        <circle cx="290" cy="312" r="226" stroke-opacity=".1" stroke-width="1.5"/>
      </g>
    </svg>
    <svg class="drop" viewBox="0 0 40 44" aria-hidden="true"><path d="M20 2C20 2 9 15 9 22a11 11 0 0 0 22 0C31 15 20 2 20 2z" fill="#5cc8e8"/><path d="M14.5 22.5a5.5 5.5 0 0 0 4 5" fill="none" stroke="#0b3c5d" stroke-width="2" stroke-linecap="round"/><ellipse cx="20" cy="39" rx="18" ry="4" fill="none" stroke="#eef6fa" stroke-width="2.2"/><ellipse cx="20" cy="39" rx="8" ry="1.8" fill="#5cc8e8"/></svg>
    <div>
      <h1>Armando<br>Santibañez Machuca</h1>
      <p class="role">Ingeniero Agrícola</p>
    </div>
  </header>

  <section class="content">
    <div class="info">
      <div class="row">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C12 3 5 11 5 15.5a7 7 0 0 0 14 0C19 11 12 3 12 3z"/></svg>
        <div><small>Especialidad</small><b>Recursos Hídricos</b></div>
      </div>
      <a class="row" href="tel:+51999853559">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
        <div><small>Celular</small><b>+51 999 853 559</b></div>
      </a>
    </div>

    <div class="actions">
      <a class="btn wa" href="https://wa.me/51999853559?text=Hola%20Armando%2C%20te%20contacto%20por%20tu%20tarjeta%20NFC">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.2 1.1z"/></svg>
        Escríbeme por WhatsApp</a>
      <a class="btn save" href="armando-santibanez.vcf" download>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="8" r="4"/><path d="M2 21c0-4 3.6-7 8-7"/><path d="M19 14v7M15.5 17.5h7"/></svg>
        Guardar contacto</a>
      <p class="foot">Tarjeta NFC por <strong>Tinkuy</strong></p>
    </div>
  </section>
</main>
</body>
</html>
